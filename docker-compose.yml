services:
  ecommerce.api:
    image: $ecommerceapi
    build:
      context: .
      dockerfile: eCommerce.API/Dockerfile
      environment:
        - ASPNETCORE_ENVIRONMENT=Development
        - MONGO_HOST=mongodb
        - MONGO_PORT=27017
        - MONGO_DB=ecommerce-orders-database 
      ports:
        - "5000:8080"